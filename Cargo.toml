[package]
name = "sidekick"
version = "0.1.1"
edition = "2021"
description = "herdr side panels for coding agents: worktrees, changes and Claude Code subagents"
license = "MIT"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
similar = "3"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }  # pure-Rust regex: no C toolchain for cross builds
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
