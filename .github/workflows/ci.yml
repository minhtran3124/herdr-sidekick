name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      - name: shell scripts parse
        run: |
          bash -n sidekick.sh scripts/statusbar.sh
          sh -n scripts/run.sh scripts/build.sh
