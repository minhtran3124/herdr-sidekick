# Push a tag matching the manifest version (v0.1.0) to publish binaries that scripts/build.sh
# downloads at install time. Linux builds are static (musl), so one binary runs on any distro.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: version matches the tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml | head -n1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "manifest $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf sidekick-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release sidekick
      - uses: softprops/action-gh-release@v2
        with:
          files: sidekick-${{ matrix.target }}.tar.gz
